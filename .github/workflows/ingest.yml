name: Ingest

on:
  # Asks for hourly, but GitHub schedules are best-effort and get dropped under
  # load: measured 2026-07-04..07-13 this fired 7-16×/day, never 24. Worker
  # volume is light (≤2 new tweets/hr typical) so it still keeps up. Actions
  # minutes are not a constraint here — this repo is public, and public repos
  # get unmetered Actions on standard runners. If punctuality ever matters,
  # drive workflow_dispatch from an external cron instead of tightening this
  # schedule — GitHub drops tightened schedules too.
  # GitHub also auto-disables this schedule after 60 days without repo
  # activity (state=disabled_inactivity; happened ~2026-10-01, Reader stale
  # for 8 days). Re-enable with `gh workflow enable ingest.yml`.
  schedule:
    # Minute 17, not 0: GitHub drops the most schedules at the top of the
    # hour; after the 2026-10-09 re-enable, six consecutive :00 slots never fired.
    - cron: "17 * * * *"
  # Manual trigger for testing without waiting for the next hour.
  workflow_dispatch:

# Cancel in-flight runs if a new one starts (e.g. manual + scheduled overlap)
# so we never have two ingest workers racing on the same Supabase rows.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the pnpm version from package.json's
      # "packageManager" field; runs before setup-node so cache: pnpm works.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch RSS sources
        run: pnpm run fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Translate untranslated Japanese posts
        run: pnpm run translate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Live-schedule discovery. Independent of the Reader pipeline: a failure
      # here must not mask a successful fetch/translate run.
      - name: Discover streams for the live schedule
        run: pnpm run streams
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
