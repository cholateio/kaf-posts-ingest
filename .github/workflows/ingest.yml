name: Ingest

on:
  # Triggered hourly by an external scheduler calling the workflow_dispatch
  # API. Do NOT add `schedule:` back: GitHub runs it best-effort (far fewer
  # than 24 runs/day) and auto-disables schedule-bearing workflows after 60
  # days of repo inactivity -- and a disabled workflow rejects
  # workflow_dispatch too, which would silently stop the external trigger.
  workflow_dispatch:

# Queue (not cancel) overlapping runs, e.g. a manual run during a Scheduler
# run, so two ingest workers never race on the same Supabase rows.
concurrency:
  group: ingest
  cancel-in-progress: false

# Least privilege: the job only checks out this repo; all writes go to
# external services via secrets.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm/action-setup reads the pnpm version from package.json's
      # "packageManager" field; runs before setup-node so cache: pnpm works.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch RSS sources
        run: pnpm run fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Translate untranslated Japanese posts
        run: pnpm run translate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Live-schedule discovery. Independent of the Reader pipeline: a failure
      # here must not mask a successful fetch/translate run.
      - name: Discover streams for the live schedule
        run: pnpm run streams
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
