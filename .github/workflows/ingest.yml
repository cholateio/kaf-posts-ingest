name: Ingest

on:
  # Only trigger: GCP Cloud Scheduler job `kaf-posts-ingest-hourly` (project
  # kaf-obs, asia-east1, `15 * * * *`) POSTs the workflow_dispatch API with a
  # fine-grained PAT (this repo only, Actions: read/write, no expiration).
  # Do NOT add `schedule:` back: GitHub ran it best-effort (4-16 runs/day,
  # never 24) and auto-disables schedule-bearing workflows after 60 days of
  # repo inactivity — and a disabled workflow rejects workflow_dispatch too,
  # which would silently kill the Scheduler trigger as well (2026-10-01..09
  # outage: Reader stale 8 days, fan posts for 10/2-10/7 lost for good since
  # rss.app keeps only 25 items per feed).
  workflow_dispatch:

# Queue (not cancel) overlapping runs, e.g. a manual run during a Scheduler
# run, so two ingest workers never race on the same Supabase rows.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the pnpm version from package.json's
      # "packageManager" field; runs before setup-node so cache: pnpm works.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch RSS sources
        run: pnpm run fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Translate untranslated Japanese posts
        run: pnpm run translate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Live-schedule discovery. Independent of the Reader pipeline: a failure
      # here must not mask a successful fetch/translate run.
      - name: Discover streams for the live schedule
        run: pnpm run streams
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
